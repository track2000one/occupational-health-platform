[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "cd backend && python -m ensurepip --upgrade || true",
  "cd backend && python -m pip install --upgrade pip",
  "cd backend && python -m pip install -r requirements.txt"
]

[phases.build]
cmds = ["cd backend && python manage.py collectstatic --noinput"]

[start]
cmd = "cd backend && python manage.py migrate && python manage.py bootstrap_admin && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
