name: Apply Real Health Card QR

on:
  push:
    branches:
      - feature/real-health-card-qr
    paths:
      - '.github/scripts/apply_real_health_card_qr.py'
      - '.github/workflows/apply-real-health-card-qr.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-health-card-qr
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply implementation
        run: python .github/scripts/apply_real_health_card_qr.py

      - name: Install QR dependency
        run: npm install qrcode.react@4.2.0 --save --prefix frontend --legacy-peer-deps

      - name: Verify backend syntax
        run: |
          python -m py_compile backend/health/models.py backend/health/serializers.py backend/health/views.py backend/health/urls.py

      - name: Verify frontend build
        run: npm run build --prefix frontend

      - name: Commit implementation and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_real_health_card_qr.py .github/workflows/apply-real-health-card-qr.yml
          git add backend frontend
          git commit -m "Activate secure QR verification for health cards"
          git push origin HEAD:feature/real-health-card-qr
