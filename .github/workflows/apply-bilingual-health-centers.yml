name: Apply Bilingual Health Centers

on:
  push:
    branches:
      - feature/bilingual-health-centers-ui
    paths:
      - scripts/apply-bilingual-health-centers.py
      - .github/workflows/apply-bilingual-health-centers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bilingual-health-centers-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply implementation
        run: python scripts/apply-bilingual-health-centers.py
      - name: Verify Python syntax
        run: python -m compileall backend
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit implementation and remove one-time helpers
        run: |
          rm -f scripts/apply-bilingual-health-centers.py
          rm -f .github/workflows/apply-bilingual-health-centers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve bilingual health center selection UI" || exit 0
          git push origin HEAD:feature/bilingual-health-centers-ui
