name: Refine Health Center Building Type

on:
  push:
    branches:
      - fix/health-center-building-type-unknown
    paths:
      - scripts/refine-health-center-building-type.mjs
      - .github/workflows/refine-health-center-building-type.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/health-center-building-type-unknown
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply refinement
        run: node scripts/refine-health-center-building-type.mjs
      - name: Verify Python syntax
        run: python -m compileall backend
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit refinement and remove one-time helpers
        run: |
          rm -f scripts/refine-health-center-building-type.mjs
          rm -f .github/workflows/refine-health-center-building-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle unclassified health center building types safely" || exit 0
          git push origin HEAD:fix/health-center-building-type-unknown
