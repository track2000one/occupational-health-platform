name: Apply Health Centers Master Data

on:
  push:
    branches:
      - feature/health-centers-master-data
    paths:
      - scripts/apply-health-centers-master-data.mjs
      - .github/workflows/apply-health-centers-master-data.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-centers-master-data
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair generated template escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-health-centers-master-data.mjs')
          source = path.read_text(encoding='utf-8')
          source = source.replace('${API_BASE_URL}', '\\${API_BASE_URL}')
          source = source.replace(
              "created_at = models.DateTimeField(auto_now_add=True)\\n    updated_at = models.DateTimeField(auto_now=True)",
              "created_at = models.DateTimeField(auto_now_add=True, null=True)\\n    updated_at = models.DateTimeField(auto_now=True, null=True)",
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply implementation
        run: node scripts/apply-health-centers-master-data.mjs
      - name: Verify Python syntax
        run: python -m compileall backend
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit implementation and remove one-time helpers
        run: |
          rm -f scripts/apply-health-centers-master-data.mjs
          rm -f .github/workflows/apply-health-centers-master-data.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add centralized health centers master data" || exit 0
          git push origin HEAD:feature/health-centers-master-data
