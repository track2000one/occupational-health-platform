name: Apply Platform Resilience

on:
  push:
    branches:
      - fix/platform-resilience-performance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/platform-resilience-performance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply implementation
        run: python .github/scripts/apply_platform_resilience.py

      - name: Verify backend syntax
        run: |
          python -m py_compile backend/core/settings.py backend/core/urls.py backend/health/views.py
          sh -n backend/start.sh

      - name: Verify frontend build
        run: |
          npm ci --prefix frontend --legacy-peer-deps
          npm run build --prefix frontend

      - name: Commit implementation and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_platform_resilience.py .github/workflows/apply-platform-resilience.yml
          git add backend frontend
          git commit -m "Harden platform responsiveness and API resilience"
          git push origin HEAD:fix/platform-resilience-performance
