name: Employee lifecycle checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/employee-lifecycle-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: workflow-test-only-secret
      DEBUG: "1"
      LEGACY_EMPLOYEE_EXCEL_IMPORTS_ENABLED: "true" # Synthetic historical tests only; production defaults false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - name: Python dependency advisory scan
        id: python_audit
        continue-on-error: true
        run: |
          python -m pip check
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --format=json --output "$RUNNER_TEMP/ohp-python-audit.json" || status=$?
          python ops/dependency_audit_summary.py python "$RUNNER_TEMP/ohp-python-audit.json" "${status:-0}"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test health.test_department_directory health.test_employee_department_affiliation health.test_provisional_employee_roster health.test_employee_import_v2 health.test_employee_import_v2_restore health.test_employee_import_v2_direct health.test_employee_roster_reconciliation health.test_employee_review_cleanup health.test_employee_review_identity_reconciliation health.test_employee_import_classification health.test_employee_provisional_registry health.test_employee_completion_review health.test_center_directory_matching health.test_health_center_structured_profile health.test_health_center_archive health.test_center_foundation health.test_health_center_excel_import health.test_employee_registry_reset health.test_employee_safe_archive health.test_employee_archived_list_visibility health.test_employee_registry_reports health.test_employment_lifecycle health.test_workforce_preview health.test_workforce_import health.test_staging_synthetic health.test_staging_load health.test_temporary_workforce health.test_employee_org_template_v4 health.test_employee_organization_bulk_sync health.test_provisional_appointment_sync health.test_health_data_import health.test_health_data_card_commit health.test_linked_health_card_records health.test_staging_clinical_entry health.test_linked_visit_injury_records health.test_staging_health_observation health.test_staging_fitness_committee health.test_staging_health_metrics health.test_health_import_end_to_end health.test_staging_operational_readiness health.test_health_import_sample health.test_health_card_completion health.test_staging_security health.test_staging_registry_scope health.test_staging_sessions health.test_staging_medical_attachments health.test_staging_security_performance periodic_stats.tests --verbosity 2

      - name: Require clean and complete Python dependency audit
        if: always()
        run: test "${{ steps.python_audit.outcome }}" = success

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The one-time candidate job resolves from npm in the read-only runner.
      # It MUST be replaced with committed manifests before the PR leaves draft.
      - name: Generate compatible npm security candidate
        if: github.head_ref == 'feature/ohp-staging-dependency-remediation-145-20261128'
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --save-exact react-router@7 react-router-dom@7 i18next@26
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --save-dev --save-exact vite@6
          npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps || echo "Residual advisories or resolution error; inspect the subsequent audit."
          node -e "const fs=require('fs'), p=require('./package.json'); if(p.dependencies['react-router']!==p.dependencies['react-router-dom'])throw Error('Router versions must match'); if(!/^7\\./.test(p.dependencies['react-router'])||!/^6\\./.test(p.devDependencies.vite))throw Error('Unexpected major version'); if(p.pnpm?.overrides?.vite)p.pnpm.overrides.vite=p.devDependencies.vite; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');"
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          git diff --stat -- package.json package-lock.json
      - name: Preserve candidate manifests for explicit review
        if: github.head_ref == 'feature/ohp-staging-dependency-remediation-145-20261128'
        uses: actions/upload-artifact@v4
        with:
          name: ohp-npm-security-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
          retention-days: 3
          if-no-files-found: error
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Test safe offline employee-center correction TSV
        run: node --test src/app/utils/employeeCenterCorrectionTsv.test.mjs
      - name: Test verified organizational hierarchy derivation and synchronization
        run: |
          ./node_modules/.bin/esbuild src/app/data/employeeOrganizationalHierarchy.test.ts --bundle --platform=node --format=esm --outfile=/tmp/ohp-org-hierarchy.test.mjs
          node --test /tmp/ohp-org-hierarchy.test.mjs
      - run: npm run build
      - name: JavaScript dependency advisory scan
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/ohp-npm-audit.json" || status=$?
          python ../backend/ops/dependency_audit_summary.py npm "$RUNNER_TEMP/ohp-npm-audit.json" "${status:-0}"

      - name: Require clean and complete npm dependency audit
        if: always()
        run: test "${{ steps.npm_audit.outcome }}" = success

  postgres-integration:
    runs-on: ubuntu-latest
    # Isolated synthetic database; NEVER use Railway credentials or user spreadsheets.
    services:
      postgres:
        # Match the GitHub runner's PostgreSQL 18 pg_dump/pg_restore clients.
        # A PG18 dump contains transaction_timeout, unsupported by PG16.
        image: postgres:18
        env:
          POSTGRES_DB: occupational_ci
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: synthetic_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_only -d occupational_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_only:synthetic_ci_password@127.0.0.1:5432/occupational_ci
      DEBUG: "True"
      LEGACY_EMPLOYEE_EXCEL_IMPORTS_ENABLED: "true" # Synthetic PostgreSQL regression only
      SECRET_KEY: synthetic-key-not-for-production
      PGPASSWORD: synthetic_ci_password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Migrate a separate PostgreSQL database
        run: python manage.py migrate --noinput
      - name: Run workforce tests against real PostgreSQL (not SQLite)
        run: python manage.py test health.test_department_directory health.test_employee_department_affiliation health.test_provisional_employee_roster health.test_employee_import_v2 health.test_employee_import_v2_restore health.test_employee_import_v2_direct health.test_employee_roster_reconciliation health.test_employee_review_cleanup health.test_employee_review_identity_reconciliation health.test_employee_import_classification health.test_employee_provisional_registry health.test_employee_completion_review health.test_center_directory_matching health.test_health_center_structured_profile health.test_health_center_archive health.test_center_foundation health.test_health_center_excel_import health.test_employee_registry_reset health.test_employee_safe_archive health.test_employee_archived_list_visibility health.test_employee_registry_reports health.test_employment_lifecycle health.test_workforce_preview health.test_workforce_import health.test_staging_synthetic health.test_staging_load health.test_temporary_workforce health.test_employee_org_template_v4 health.test_employee_organization_bulk_sync health.test_provisional_appointment_sync health.test_health_data_import health.test_health_data_card_commit health.test_linked_health_card_records health.test_staging_clinical_entry health.test_linked_visit_injury_records health.test_staging_health_observation health.test_staging_fitness_committee health.test_staging_health_metrics health.test_health_import_end_to_end health.test_staging_operational_readiness health.test_health_import_sample health.test_health_card_completion health.test_staging_security health.test_staging_registry_scope health.test_staging_sessions health.test_staging_medical_attachments health.test_staging_security_performance periodic_stats.tests --verbosity 2
      - name: Seed synthetic disaster recovery fixture
        run: OHP_DR_CI_SYNTHETIC=yes python manage.py shell -c "exec(open('ops/seed_disaster_drill.py',encoding='utf-8').read())"
      - name: Encrypted snapshot and independent synthetic disaster restore
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/ohp-dr.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/archive"
          printf '%s' 'Synthetic-CI-Only-Backup-Key-Not-For-Real-Employees-2026!' > "$work/key"
          printf '%s' 'Synthetic-Wrong-CI-Only-Key-Not-For-Real-Employees-2026!' > "$work/wrong"
          export OHP_DR_SOURCE_URL="$DATABASE_URL"
          export OHP_DR_TARGET_URL=postgresql://ci_only:synthetic_ci_password@127.0.0.1:5432/occupational_ci_dr_restore
          python ops/staging_disaster_drill.py backup --output-dir "$work/archive" --passphrase-file "$work/key" --confirm-synthetic
          archive=$(find "$work/archive" -name '*.pgdump.gpg' -print -quit)
          test -s "$archive"
          test -s "$archive.manifest.gpg"
          if grep -aq 'ohp-qa-01@example.invalid' "$archive"; then echo "Plaintext detected"; exit 1; fi
          createdb -h 127.0.0.1 -p 5432 -U ci_only occupational_ci_dr_restore
          # Source may change or be unavailable after backup. Restore must use snapshot evidence, not current source.
          psql -h 127.0.0.1 -U ci_only -d occupational_ci -v ON_ERROR_STOP=1 -c "UPDATE health_employee SET risk_level='low' WHERE employee_number='OHP-QA-01';"
          unset OHP_DR_SOURCE_URL DATABASE_URL
          if python ops/staging_disaster_drill.py restore-verify --archive "$archive" --passphrase-file "$work/wrong" --confirm-synthetic --confirm-disposable; then echo "Wrong key accepted"; exit 1; fi
          cp "$archive" "$work/original"
          printf 'tampered' >> "$archive"
          if python ops/staging_disaster_drill.py restore-verify --archive "$archive" --passphrase-file "$work/key" --confirm-synthetic --confirm-disposable; then echo "Tampered archive accepted"; exit 1; fi
          mv "$work/original" "$archive"
          test "$(psql -h 127.0.0.1 -U ci_only -d occupational_ci_dr_restore -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public'")" = 0
          if OHP_DR_TARGET_URL=postgresql://ci_only:synthetic_ci_password@127.0.0.1:5432/occupational_ci python ops/staging_disaster_drill.py restore-verify --archive "$archive" --passphrase-file "$work/key" --confirm-synthetic --confirm-disposable; then echo "Source name accepted"; exit 1; fi
          if python ops/staging_disaster_drill.py restore-verify --archive "$archive" --passphrase-file "$work/key" --confirm-synthetic; then echo "Unconfirmed restore accepted"; exit 1; fi
          python ops/staging_disaster_drill.py restore-verify --archive "$archive" --passphrase-file "$work/key" --confirm-synthetic --confirm-disposable
          test "$(psql -h 127.0.0.1 -U ci_only -d occupational_ci_dr_restore -Atc "SELECT count(*) FROM health_employee WHERE employee_number='OHP-QA-01' AND risk_level='high'")" = 1
          test "$(psql -h 127.0.0.1 -U ci_only -d occupational_ci_dr_restore -Atc "SELECT count(*) FROM health_stagingmedicalattachment WHERE byte_size=octet_length(file_data) AND checksum_sha256=encode(sha256(file_data),'hex')")" = 1
          test "$(psql -h 127.0.0.1 -U ci_only -d occupational_ci_dr_restore -Atc "SELECT count(*) FROM health_stagingauthsession WHERE revoked_at IS NOT NULL")" = 1
          if python ops/staging_disaster_drill.py restore-verify --archive "$archive" --passphrase-file "$work/key" --confirm-synthetic --confirm-disposable; then echo "Repeated restore accepted"; exit 1; fi
          echo "Synthetic recovery: encrypted snapshot, authenticated manifest, row fingerprints, attachments, revoked sessions, source independence, rejection gates PASS."


  staging-smoke:
    runs-on: ubuntu-latest
    # This job only sends anonymous HTTP GET/OPTIONS to isolated public staging.
    # Do not send tokens, actual employees, or production data through CI logs.
    steps:
      - name: Verify staging routes and unauthenticated access denied
        run: |
          set -euo pipefail
          api="https://occupational-staging-backend-staging.up.railway.app"
          frontend="https://occupational-staging-frontend-staging.up.railway.app"
          for attempt in 1 2 3 4; do
            if curl --silent --show-error --fail --retry 2 --max-time 15 "$api/health/" -o /tmp/staging-health.json && grep -q '"status":"ok"' /tmp/staging-health.json; then
              break
            fi
            if [ "$attempt" = "4" ]; then echo "Staging backend health failed"; exit 1; fi
            sleep 7
          done
          curl --silent --show-error --fail --retry 2 --max-time 20 "$frontend/" -o /tmp/staging-index.html
          grep -qi 'id="root"' /tmp/staging-index.html
          for endpoint in /api/employees/ /api/workforce-roster/import-plan/ /api/workforce-roster/mapping/ /api/health-data-import/template/ /api/staging-clinical/metrics/ /api/staging-clinical/metrics/?download=xlsx; do
            code=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$api$endpoint")
            if [ "$code" != 401 ] && [ "$code" != 403 ]; then
              echo "Private route did not require login: $endpoint ($code)"; exit 1
            fi
          done
          echo "Staging smoke passed: backend health, frontend HTML, and protected endpoints."
      - name: Verify only staging frontend origin receives CORS authorization
        run: |
          set -euo pipefail
          api="https://occupational-staging-backend-staging.up.railway.app"
          allowed="https://occupational-staging-frontend-staging.up.railway.app"
          curl --silent --show-error --max-time 15 --fail -D /tmp/allowed -o /dev/null \
            -X OPTIONS "$api/api/workforce-roster/import-plan/" \
            -H "Origin: $allowed" -H "Access-Control-Request-Method: POST"
          grep -iF "access-control-allow-origin: $allowed" /tmp/allowed >/dev/null
          curl --silent --show-error --max-time 15 --fail -D /tmp/untrusted -o /dev/null \
            -X OPTIONS "$api/api/workforce-roster/import-plan/" \
            -H "Origin: https://unrelated-application.up.railway.app" \
            -H "Access-Control-Request-Method: POST"
          if grep -qi '^access-control-allow-origin:' /tmp/untrusted; then
            echo "Untrusted domain was authorized by CORS"; exit 1
          fi
          echo "Staging CORS allowlist: PASS."
