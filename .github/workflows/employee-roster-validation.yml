name: Workforce roster validation

on:
  pull_request:
    branches:
      - main
      - feature/bilingual-job-title-20261031
  push:
    branches:
      - feature/roster-19col-preview-20261031

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check database model migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: 'true'
      - name: Test workforce mapping on synthetic identities only
        run: python manage.py test health.tests health.test_organization_center_mappings
        env:
          DEBUG: 'true'

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Existing main-branch package-lock.json is out of sync with package.json.
      # Install dependencies to validate this PR's TSX build without changing repository files.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
