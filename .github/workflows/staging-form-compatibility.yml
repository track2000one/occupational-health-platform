name: Staging roster form compatibility

on:
  push:
    branches:
      - feature/staging-employee-form-compat-20261101

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'True'
      SECRET_KEY: 'synthetic-ci-secret'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test health.test_staging_roster_form health.test_employment_lifecycle health.test_workforce_preview health.test_workforce_import --verbosity 1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test src/app/utils/employeeFormValidation.test.ts
      - run: npm run build
