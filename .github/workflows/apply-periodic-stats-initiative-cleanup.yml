name: Apply Periodic Statistics Initiative Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-initiatives-from-periodic-stats.mjs'
      - '.github/workflows/apply-periodic-stats-initiative-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply cleanup
        run: node scripts/remove-initiatives-from-periodic-stats.mjs
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit source changes and remove one-time helpers
        run: |
          rm -f scripts/remove-initiatives-from-periodic-stats.mjs
          rm -f .github/workflows/apply-periodic-stats-initiative-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Refocus periodic statistics on occupational health operations'
          git push origin main
